apiVersion: v1
kind: Pod
metadata:
  name: adguard-pod
  labels:
    app: adguard
spec:
  containers:
    - name: adguard
      image: docker.io/adguard/adguardhome:latest
      ports:
        # DNS Ports (Map container 53 to host 5053 to completely bypass NetBird)
        - containerPort: 53
          hostPort: 5053
        - containerPort: 53
          hostPort: 5053
          protocol: UDP
        # Setup Web UI
        - containerPort: 3000
          hostPort: 3030
        # Management Web UI
        - containerPort: 80
          hostPort: 8080
      volumeMounts:
        # The :Z flags tell Fedora's SELinux to grant Podman read/write access
        - name: adguard-work
          mountPath: /opt/adguardhome/work:Z
        - name: adguard-conf
          mountPath: /opt/adguardhome/conf:Z
  volumes:
    - name: adguard-work
      hostPath:
        path: /home/mleccardi/.local/share/adguard/work
        type: DirectoryOrCreate
    - name: adguard-conf
      hostPath:
        path: /home/mleccardi/.local/share/adguard/conf
        type: DirectoryOrCreate
