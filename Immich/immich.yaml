apiVersion: v1
kind: Pod
metadata:
  name: immich-pod
  labels:
    app: immich
spec:
  containers:
  # 1. IMMICH SERVER
  - name: immich-server
    image: ghcr.io/immich-app/immich-server:release
    ports:
    - containerPort: 2283
      hostPort: 2283
    env:
    - name: DB_HOSTNAME
      value: "127.0.0.1"
    - name: REDIS_HOSTNAME
      value: "127.0.0.1"
    - name: DB_USERNAME
      value: "postgres"
    - name: DB_PASSWORD
      value: "<YOUR_PASSWORD_HERE_TO_MODIFY_THIS_VALUE_HERE>"
    - name: DB_DATABASE_NAME
      value: "immich"
    volumeMounts:
    - mountPath: /data
      name: immich-library
    - mountPath: /etc/localtime
      name: localtime
      readOnly: true

  # 2. MACHINE LEARNING ENGINE
  - name: immich-machine-learning
    image: ghcr.io/immich-app/immich-machine-learning:release
    env:
    - name: DB_HOSTNAME
      value: "127.0.0.1"
    - name: REDIS_HOSTNAME
      value: "127.0.0.1"
    volumeMounts:
    - mountPath: /cache
      name: model-cache

  # 3. VALKEY (REDIS REPLACEMENT)
  - name: immich-redis
    image: docker.io/valkey/valkey:9@sha256:4963247afc4cd33c7d3b2d2816b9f7f8eeebab148d29056c2ca4d7cbc966f2d9

  # 4. POSTGRES VECTOR DATABASE
  - name: immich-postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    env:
    - name: POSTGRES_USER
      value: "postgres"
    - name: POSTGRES_PASSWORD
      value: "postgres"
    - name: POSTGRES_DB
      value: "immich"
    - name: POSTGRES_INITDB_ARGS
      value: "--data-checksums"
    volumeMounts:
    - mountPath: /var/lib/postgresql/data
      name: immich-db-data
    - mountPath: /dev/shm
      name: dshm

  # VOLUME MAPPINGS
  volumes:
  - name: immich-library
    hostPath:
      # REPLACE WITH YOUR USERNAME
      path: /home/mleccardi/Immich/library 
      type: DirectoryOrCreate
  - name: immich-db-data
    hostPath:
      # REPLACE WITH YOUR USERNAME
      path: /home/mleccardi/Immich/postgres
      type: DirectoryOrCreate
  - name: model-cache
    persistentVolumeClaim:
      claimName: immich-model-cache-pvc
  - name: localtime
    hostPath:
      path: /etc/localtime
  - name: dshm
    emptyDir:
      medium: Memory
      sizeLimit: 128Mi
