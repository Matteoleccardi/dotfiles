server {
    listen 80;
    server_name immich.leckmesh.net;

    # Allow huge file uploads (50 Gigabytes) for large 4K videos
    client_max_body_size 50000M;

    location / {
        # Route to your Immich container
        proxy_pass http://127.0.0.1:2283;
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (Crucial for the mobile app background sync)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Extend timeouts for slow video uploads over mobile data
        proxy_read_timeout 800s;
        proxy_send_timeout 800s;
        proxy_connect_timeout 800s;
    }
}
