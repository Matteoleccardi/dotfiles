# ==============================================================================
# FILE LOCATION:
# Save this file at: /etc/nginx/conf.d/<service-name>.leckmesh.net.conf
#
# HOW TO UPDATE AND RESTART:
# Whenever you make changes to this file (or add new ones), run these two commands:
# 1. Check for typos:     sudo nginx -t
# 2. Apply the changes:   sudo systemctl reload nginx
# ==============================================================================

server {
    # Listen for standard incoming HTTP web traffic
    listen 80;
    
    # The custom domain name you are typing into your browser
    server_name snapotter.leckmesh.net;

    location / {
        # Where Nginx should send the traffic internally
        proxy_pass http://127.0.0.1:1349;
        
        # These headers ensure the service knows the original IP of the device asking, 
        # rather than just seeing Nginx's internal IP.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

	      # MANDATORY HEADERS FOR PDFCRAFT COOP/COEP ISOLATION
	      # (ONLY FOR THIS SPECIFIC SERVICE)
        # ALSO FOR ANY SERVICE WHICH MIGHT REQUIRE BEEFY WEB-ASSEMBLY STUFF
        # CAN POSE SECURITY CONCERNS, BUT IF YOU USE THAT PRIVATELY, THEN IT'S NO PROBLEM.

        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Embedder-Policy;
        proxy_hide_header Cross-Origin-Resource-Policy;
        
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
    }
}
