[[mgr.prepend_keymap]]
on   = "o"
run  = "plugin shell-cwd"
desc = "Exit Yazi to hovered folder, or open file normally"

[[mgr.prepend_keymap]]
on   = "q"
run  = "quit --no-cwd-file"
desc = "Exit Yazi and keep original terminal directory"

[[mgr.prepend_keymap]]
on   = "<C-c>"
run  = "quit --no-cwd-file"
desc = "Exit Yazi via Ctrl+C and keep original terminal directory"

[[mgr.prepend_keymap]]
on   = "<Enter>"
run  = "plugin smart-enter"
desc = "Enter directory if folder, open if file"
